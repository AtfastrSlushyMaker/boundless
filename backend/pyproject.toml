[project]
name = "boundless-api"
version = "0.1.0"
description = "Local-first campaign engine for Boundless"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "greenlet>=3.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pgvector>=0.3",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.31.3; sys_platform == 'darwin'"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B007"]
